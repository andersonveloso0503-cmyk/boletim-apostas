name: Atualizar boletim da rodada

on:
  schedule:
    # Todos os dias às 08:00 (horário de Brasília = 11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch: {} # permite rodar manualmente pelo GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar boletim
        run: node scripts/build.js

      - name: Commitar e publicar
        run: |
          git config user.name "boletim-bot"
          git config user.email "boletim-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Atualiza boletim da rodada"
          git push
